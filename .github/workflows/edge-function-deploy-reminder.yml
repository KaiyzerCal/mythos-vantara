name: Edge function deploy reminder

# Merging to main publishes the frontend only. Edge functions for this project are deployed separately, through Lovable
# (see the note in deploy-mavis-functions.yml), and nothing warns when a merged change to supabase/functions/** has not
# been deployed — the app just keeps running the old function code. This comment names exactly which functions a merged
# PR changed, so the deploy step can't be forgotten or missed a function. It deploys nothing itself.

on:
  pull_request:
    types: [closed]
    branches: ["main"]
    paths: ["supabase/functions/**"]

permissions:
  pull-requests: write
  contents: read

jobs:
  remind:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: context.payload.pull_request.number, per_page: 100,
            });
            const direct = new Set();
            let shared = false;
            for (const f of files) {
              const m = f.filename.match(/^supabase\/functions\/([^/]+)\//);
              if (!m) continue;
              if (m[1] === "_shared") shared = true; else direct.add(m[1]);
            }
            if (direct.size === 0 && !shared) return;
            const list = [...direct].sort().map((n) => `- \`${n}\``).join("\n") || "_none directly_";
            const sharedNote = shared
              ? "\n\nThis PR also changed `supabase/functions/_shared/**`. Every function that imports a changed shared file needs redeploying too; check which ones import it before deploying."
              : "";
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.pull_request.number,
              body: `**Edge functions to deploy** (merging does not deploy them):\n\n${list}${sharedNote}\n\nAfter deploying, probe something that only exists in the new code. A merge and a publish succeeding says nothing about the running functions.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`,
            });
