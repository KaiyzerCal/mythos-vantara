name: OTA Release (Live Update)

# Publishes a new self-hosted live-update bundle to the ota-bundles Supabase
# Storage bucket whenever the web app changes. src/lib/liveUpdate.ts (native
# side) checks manifest.json at startup and applies whatever's newest here —
# no app-store review needed for JS/CSS-only changes, same category of
# update Capgo/Appflow/CodePush operate in.
#
# Uploads go straight to the Storage REST API with OTA_SUPABASE_URL /
# OTA_SUPABASE_SERVICE_ROLE_KEY (plain repo secrets, not environment-scoped)
# rather than through `supabase link` + the CLI. The existing
# SUPABASE_ACCESS_TOKEN/SUPABASE_PROJECT_REF secrets (deploy-mavis-
# functions.yml) turned out to resolve to an unrelated personal Supabase
# account, not this project's real one — confirmed live via `supabase
# projects list` on main, not just a branch-scoping fluke. VANTARA's actual
# deploys have been staying in sync via Lovable's own separate pipeline,
# not that workflow.
on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "vite.config.mts"
      - "capacitor.config.ts"
      - ".github/workflows/ota-release.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        run: bun run build

      - name: Zip bundle and compute checksum
        id: bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_SHA::12}"
          cd dist
          zip -qr "../${VERSION}.zip" .
          cd ..
          CHECKSUM=$(sha256sum "${VERSION}.zip" | cut -d' ' -f1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "checksum=${CHECKSUM}" >> "$GITHUB_OUTPUT"
          cat > manifest.json <<EOF
          {"version":"${VERSION}","url":"https://wlygujlvsfimhtqsdxrx.supabase.co/storage/v1/object/public/ota-bundles/${VERSION}.zip","checksum":"${CHECKSUM}"}
          EOF
          cat manifest.json

      - name: Upload bundle and manifest
        env:
          OTA_SUPABASE_URL: ${{ secrets.OTA_SUPABASE_URL }}
          OTA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.OTA_SUPABASE_SERVICE_ROLE_KEY }}
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          set -euo pipefail
          upload() {
            local file="$1" dest="$2"
            code=$(curl -sS -o /tmp/upload_resp.txt -w "%{http_code}" \
              -X POST "${OTA_SUPABASE_URL}/storage/v1/object/ota-bundles/${dest}" \
              -H "Authorization: Bearer ${OTA_SUPABASE_SERVICE_ROLE_KEY}" \
              -H "apikey: ${OTA_SUPABASE_SERVICE_ROLE_KEY}" \
              -H "x-upsert: true" \
              --data-binary "@${file}")
            echo "PUT ${dest}: HTTP ${code}"
            cat /tmp/upload_resp.txt
            echo
            if [ "$code" -ge 300 ]; then exit 1; fi
          }
          upload "${VERSION}.zip" "${VERSION}.zip"
          upload "manifest.json" "manifest.json"
