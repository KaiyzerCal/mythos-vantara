name: Deploy VANTARA (Mavis) Edge Functions

on:
  push:
    branches: ["main", "staging"]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-mavis-functions.yml"
  workflow_dispatch:
    inputs:
      functions:
        description: >-
          Optional space/comma-separated list of non-core functions to deploy.
          When set, overrides the usual "changed since last push" detection —
          use it to retry functions that previously failed to deploy.
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub Environments let SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF hold
    # DIFFERENT values per environment under the same secret names — main
    # deploys against the "production" environment's secrets, staging against
    # "staging"'s. See DEPLOYMENT.md for how to set up the staging project and
    # these environment-scoped secrets (Stabilization Brief Phase 2.10).
    environment: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'production' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Default fetch-depth:1 leaves no prior commit to diff against, so
          # the "changed functions" step below silently found 0 files
          # changed on every run — confirmed live (a run that genuinely
          # touched local-mesh-proxy/index.ts logged "Deploying 0 changed
          # non-core functions"). fetch-depth:0 (full history) guarantees
          # github.event.before is always resolvable.
          fetch-depth: 0
      - uses: supabase/setup-cli@v1

      - name: Report target environment
        run: |
          TARGET="${{ github.ref == 'refs/heads/staging' && 'STAGING' || 'PRODUCTION' }}"
          echo "Deploying to $TARGET (project ref: $PROJECT_REF)"

      # ── Core functions — deployed serially, fail-fast ─────────────────────────
      # If any of these fail the entire workflow stops.
      - name: Deploy core functions (fail-fast)
        run: |
          set -euo pipefail
          CORE=(
            mavis-chat
            mavis-actions
            mavis-agent
            mavis-action-executor
            mavis-telegram-bot
            telegram-webhook
            telegram-setup
            mavis-heartbeat
            mavis-dream
            mavis-orchestrator
            mavis-trigger-engine
            mavis-consolidate
            mavis-brain-consolidate
            mavis-council-session
            mavis-council-heartbeat
            mavis-morning-brief
            mavis-memory-embed
            mavis-goal-engine
            mavis-goal-loop
            mavis-goal-agent
            mavis-autonomous-runner
            mavis-gmail-webhook
            mavis-gmail-sync
            mavis-gmail-watch
            mavis-google-oauth
            mavis-push-notify
          )
          # This account's function-count ceiling makes individual `functions
          # deploy` calls non-deterministic: the CLI's create-vs-update check
          # occasionally 402s ("Max number of functions reached for project")
          # even for a function that already exists and is only being
          # updated — confirmed live (a solo, isolated redeploy of an
          # existing function still hit it). A short retry gives it another
          # chance to land within the same window rather than failing the
          # whole workflow on what's usually a transient race, not a real
          # capacity problem.
          deploy_with_retry() {
            local fn="$1" attempt
            for attempt in 1 2 3; do
              if supabase functions deploy "$fn" --project-ref "$PROJECT_REF"; then
                return 0
              fi
              echo "  retry $attempt/3 failed for $fn, waiting..."
              sleep $((attempt * 5))
            done
            return 1
          }
          for fn in "${CORE[@]}"; do
            if [ -d "supabase/functions/$fn" ]; then
              echo "→ $fn"
              deploy_with_retry "$fn"
            else
              echo "::warning::Core function '$fn' directory not found — skipping"
            fi
          done

      # ── Remaining CHANGED functions — 8 parallel workers, best-effort ────────
      # Failures are logged as warnings but do not fail the workflow.
      #
      # Used to sweep every non-core function on every push. This project is
      # at (or right at) its Supabase plan's function-count cap, so that bulk
      # "create" call 402s for most functions on almost every run — confirmed
      # via a run where local-mesh-proxy failed to deploy a real security fix
      # with "Max number of functions reached for project" despite already
      # existing (an update, not a new function). Scoping to only the
      # functions whose files actually changed in this push avoids tripping
      # the cap for normal incremental changes — mirrors the same fix already
      # applied to navi-exe's deploy workflow for the identical symptom.
      - name: Deploy changed non-core functions (parallel)
        run: |
          set -uo pipefail
          CORE=(
            mavis-chat mavis-actions mavis-agent mavis-action-executor
            mavis-telegram-bot telegram-webhook telegram-setup mavis-heartbeat
            mavis-dream mavis-orchestrator mavis-trigger-engine mavis-consolidate
            mavis-brain-consolidate mavis-council-session mavis-council-heartbeat
            mavis-morning-brief mavis-memory-embed mavis-goal-engine mavis-goal-loop
            mavis-goal-agent mavis-autonomous-runner mavis-gmail-webhook mavis-gmail-sync
            mavis-gmail-watch mavis-google-oauth mavis-push-notify
          )
          printf '%s\n' "${CORE[@]}" > /tmp/core-fns.txt

          # An explicit workflow_dispatch list wins over change detection, so a
          # batch that failed to deploy (e.g. tripped the project's function
          # cap) can be retried without having to touch its source files.
          EXPLICIT="${{ github.event.inputs.functions }}"
          if [ -n "$EXPLICIT" ]; then
            mapfile -t REMAINING < <(
              printf '%s' "$EXPLICIT" | tr ', ' '\n\n' | sed '/^$/d' | sort -u \
                | grep -vxFf /tmp/core-fns.txt | grep -vx '_archive'
            )
            echo "Deploying ${#REMAINING[@]} explicitly requested non-core functions with 8 parallel workers..."
          else
            BEFORE_SHA="${{ github.event.before }}"
            if [ -z "$BEFORE_SHA" ] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
              BEFORE_SHA="HEAD~1"
            fi
            mapfile -t REMAINING < <(
              git diff --name-only "$BEFORE_SHA" HEAD -- 'supabase/functions/*/**' \
                | cut -d/ -f3 | sort -u \
                | grep -vxFf /tmp/core-fns.txt | grep -vx '_archive'
            )
            echo "Deploying ${#REMAINING[@]} changed non-core functions with 8 parallel workers..."
          fi
          if [ "${#REMAINING[@]}" -eq 0 ]; then
            echo "No non-core functions selected for deployment."
            exit 0
          fi

          FAILURES=/tmp/deploy-failures.txt
          > "$FAILURES"

          deploy_fn() {
            local fn="$1" attempt
            # See the retry comment on deploy_with_retry in the core-functions
            # step above — same non-deterministic 402 applies here.
            #
            # Attempts 2-3 add --use-api, which bundles server-side instead of
            # via the local Docker bundler. The default path failed a whole
            # batch with `create function status 402: Max number of functions
            # reached` even though every one of those functions already exists
            # in the project — so it's worth retrying these through the API
            # path, which may treat an existing function as an update rather
            # than a create.
            for attempt in 1 2 3; do
              local extra=""
              [ "$attempt" -gt 1 ] && extra="--use-api"
              if supabase functions deploy "$fn" --project-ref "$PROJECT_REF" $extra 2>&1; then
                echo "✓ $fn${extra:+ (via --use-api)}"
                return 0
              fi
              echo "  retry $attempt/3 failed for $fn, waiting..."
              sleep $((attempt * 5))
            done
            echo "$fn" >> /tmp/deploy-failures.txt
            echo "✗ $fn (non-critical)"
          }
          export -f deploy_fn
          export PROJECT_REF

          printf '%s\n' "${REMAINING[@]}" | xargs -P 8 -I{} bash -c 'deploy_fn "$@"' _ {}

          TOTAL=${#REMAINING[@]}
          FAIL_COUNT=$(wc -l < "$FAILURES" 2>/dev/null | tr -d ' ')
          SUCCESS=$((TOTAL - FAIL_COUNT))
          echo ""
          echo "Result: $SUCCESS/$TOTAL non-core functions deployed."

          if [ -s "$FAILURES" ]; then
            echo "::warning::$FAIL_COUNT non-core function(s) failed to deploy:"
            cat "$FAILURES"
          fi

      # ── Smoke tests — staging only (Execution Blueprint Stage F) ─────────────
      # Deliberately NOT run against production: it fires real autonomy-pathway
      # triggers (the exact same payload their pg_cron job already posts, so
      # not new risk) plus a small curated set of core functions — never the
      # full --all-active sweep, which isn't vetted for side effects. This is
      # the "staging deploy → smoke tests → promote to production" gate from
      # DEPLOYMENT.md's promotion path: if this fails, staging isn't healthy
      # and staging shouldn't be merged into main yet.
      #
      # Needs three secrets on the "staging" GitHub Environment that don't
      # exist yet by default: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
      # OPERATOR_USER_ID (a real auth.users id on the staging project). The
      # step is skipped gracefully if they're not set, rather than failing
      # the whole deploy over missing optional gate secrets.
      - name: Set up Node
        if: github.ref == 'refs/heads/staging'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run smoke tests against staging
        if: github.ref == 'refs/heads/staging'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPERATOR_USER_ID: ${{ secrets.OPERATOR_USER_ID }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::warning::Skipping smoke tests — SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY not set on the staging Environment yet. See DEPLOYMENT.md."
            exit 0
          fi
          node scripts/smoke-test.mjs
