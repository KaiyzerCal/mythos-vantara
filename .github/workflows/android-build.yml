name: Android Build (Capacitor)

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sync Capacitor
        run: npx @capacitor/cli sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # Debug build only — release builds need a signing keystore, added
      # once real Play Store signing credentials exist (see docs/android-release.md).
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vantara-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
