# One-command deploy for a plain VPS (Hetzner, or any host that isn't a
# managed platform like Railway). Two containers: this service, and Caddy in
# front of it for automatic HTTPS.
#
# Why Caddy rather than exposing :8080 directly: mavis-hyperframes calls this
# service from a Supabase edge function over the public internet, and Deno's
# fetch() will not talk to a self-signed or absent certificate. Caddy gets a
# real one from Let's Encrypt with zero manual steps, as long as the domain
# in Caddyfile has a DNS A record pointed at this machine before you start it
# — that record is what Let's Encrypt's HTTP-01 challenge validates against.
#
# Usage:
#   cp .env.example .env && fill it in
#   edit Caddyfile: replace render.yourdomain.com with your real domain
#   docker compose up -d
#
# Then set on the Supabase side:
#   HYPERFRAMES_RENDER_URL = https://render.yourdomain.com
#   HYPERFRAMES_API_KEY    = the RENDER_KEY you put in .env

services:
  render:
    build: .
    restart: unless-stopped
    env_file: .env
    # Not published to the host — only Caddy talks to it, over the compose
    # network's internal DNS (the hostname "render" below).
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - render

volumes:
  caddy_data:
  caddy_config:
